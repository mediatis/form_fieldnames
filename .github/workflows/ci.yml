on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  code-quality:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php_version: ["8.2", "8.3", "8.4", "8.5"]
        typo3_version: ["12.4", "13.4", "14.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Install PHP'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '${{ matrix.php_version }}'
          coverage: none
          tools: 'composer:v2.4'
      - name: 'Show Composer version'
        run: 'composer --version'
      - name: 'Show the Composer configuration'
        run: 'composer config --global --list'
      - name: 'Cache dependencies installed with composer'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: 'php${{ matrix.php_version }}-typo3${{ matrix.typo3_version }}'
          path: ~/.cache/composer
          restore-keys: "php${{ matrix.php_version }}-composer-\n"
      - name: 'Install Composer dependencies'
        run: "composer require typo3/cms-core ^${{ matrix.typo3_version }} --no-progress\ncomposer install --no-progress\n"
      - name: 'Run command'
        run: "composer ci:static\n"
  code-tests:
    name: 'Coverage tests'
    runs-on: ubuntu-22.04
    env:
      DB_DATABASE: typo3
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: localhost
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Install PHP'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '${{ matrix.php_version }}'
          coverage: none
          tools: 'composer:v2.4'
          extensions: mysqli
      - name: 'Show Composer version'
        run: 'composer --version'
      - name: 'Show the Composer configuration'
        run: 'composer config --global --list'
      - name: 'Cache dependencies installed with composer'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: 'php${{ matrix.php_version }}-typo3${{ matrix.php_version }}'
          path: ~/.cache/composer
          restore-keys: "php${{ matrix.php_version }}-composer-\n"
      - name: 'Install Composer dependencies'
        run: "composer require typo3/cms-core ^${{ matrix.typo3_version }} --no-progress\ncomposer install --no-progress\n"
      - name: 'Start MySQL'
        run: 'sudo /etc/init.d/mysql start'
      - run: "export typo3DatabaseName=\"$DB_DATABASE\";\nexport typo3DatabaseHost=\"$DB_HOST\";\nexport typo3DatabaseUsername=\"$DB_USER\";\nexport typo3DatabasePassword=\"$DB_PASSWORD\";\ncomposer ci:coverage\n"
    strategy:
      fail-fast: false
      matrix:
        php_version: ["8.2", "8.3", "8.4", "8.5"]
        typo3_version: ["12.4", "13.4", "14.2"]
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config auto --error
